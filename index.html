<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orb Drift</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05060a; font-family: ui-sans-serif, system-ui, sans-serif; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #ui {
      position: absolute; inset: 0; pointer-events: none;
      color: #e8f0ff;
    }
    #hud {
      position: absolute; top: 16px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; gap: 12px;
      text-shadow: 0 2px 10px #000;
      font-size: 18px; letter-spacing: 0.04em;
    }
    #overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(20, 30, 60, 0.55), rgba(0,0,0,0.78));
      pointer-events: auto;
    }
    .panel {
      width: min(520px, 90vw);
      padding: 28px 32px;
      border: 1px solid rgba(140, 190, 255, 0.25);
      background: rgba(8, 12, 24, 0.82);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    h1 { margin: 0 0 8px; font-size: 36px; letter-spacing: 0.08em; }
    p { margin: 0 0 18px; color: #b8c7e6; line-height: 1.45; }
    button {
      pointer-events: auto;
      border: 0; border-radius: 10px;
      padding: 12px 18px;
      font-size: 16px; font-weight: 700; letter-spacing: 0.06em;
      color: #061018; background: #7ee0ff;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .hidden { display: none !important; }
    kbd { background: #1b2438; border-radius: 5px; padding: 1px 6px; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div>SCORE <strong id="score">0</strong></div>
      <div>TIME <strong id="time">60</strong></div>
      <div>ORBS <strong id="orbs">0</strong></div>
    </div>
    <div id="overlay">
      <div class="panel">
        <h1 id="title">ORB DRIFT</h1>
        <p id="blurb">Fly the hover-craft, scoop neon orbs, and dodge the roaming sentries. Fully client-side Babylon.js — no assets, no backend.</p>
        <p>Move with <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows. Boost with <kbd>Shift</kbd>.</p>
        <button id="startBtn" type="button">START</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    (function () {
      const canvas = document.getElementById("renderCanvas");
      const scoreEl = document.getElementById("score");
      const timeEl = document.getElementById("time");
      const orbsEl = document.getElementById("orbs");
      const overlay = document.getElementById("overlay");
      const titleEl = document.getElementById("title");
      const blurbEl = document.getElementById("blurb");
      const startBtn = document.getElementById("startBtn");

      const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.02, 0.03, 0.06, 1);

      const camera = new BABYLON.FollowCamera("cam", new BABYLON.Vector3(0, 12, -18), scene);
      camera.radius = 16;
      camera.heightOffset = 7;
      camera.rotationOffset = 180;
      camera.cameraAcceleration = 0.05;
      camera.maxCameraSpeed = 20;
      camera.attachControl(canvas, true);

      const light = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.2, 1, 0.3), scene);
      light.intensity = 0.65;
      const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-0.4, -1, 0.3), scene);
      dir.position = new BABYLON.Vector3(20, 40, -10);
      dir.intensity = 0.9;

      const glow = new BABYLON.GlowLayer("glow", scene);
      glow.intensity = 0.7;

      const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 80, height: 80 }, scene);
      const groundMat = new BABYLON.StandardMaterial("gmat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.05, 0.08, 0.14);
      groundMat.specularColor = new BABYLON.Color3(0.05, 0.08, 0.12);
      ground.material = groundMat;

      const grid = BABYLON.MeshBuilder.CreateGround("grid", { width: 80, height: 80, subdivisions: 20 }, scene);
      const gridMat = new BABYLON.StandardMaterial("gridMat", scene);
      gridMat.wireframe = true;
      gridMat.emissiveColor = new BABYLON.Color3(0.08, 0.22, 0.38);
      gridMat.alpha = 0.35;
      grid.material = gridMat;
      grid.position.y = 0.02;

      function makeWall(name, w, d, x, z) {
        const wall = BABYLON.MeshBuilder.CreateBox(name, { width: w, height: 3.2, depth: d }, scene);
        wall.position.set(x, 1.6, z);
        const mat = new BABYLON.StandardMaterial(name + "m", scene);
        mat.diffuseColor = new BABYLON.Color3(0.08, 0.16, 0.28);
        mat.emissiveColor = new BABYLON.Color3(0.02, 0.06, 0.12);
        wall.material = mat;
        return wall;
      }
      const walls = [
        makeWall("n", 84, 2, 0, 41),
        makeWall("s", 84, 2, 0, -41),
        makeWall("e", 2, 84, 41, 0),
        makeWall("w", 2, 84, -41, 0)
      ];

      const player = BABYLON.MeshBuilder.CreateBox("craft", { width: 1.6, height: 0.5, depth: 2.4 }, scene);
      player.position.set(0, 0.6, 0);
      const pmat = new BABYLON.StandardMaterial("pmat", scene);
      pmat.diffuseColor = new BABYLON.Color3(0.15, 0.7, 0.95);
      pmat.emissiveColor = new BABYLON.Color3(0.05, 0.25, 0.4);
      player.material = pmat;
      const nose = BABYLON.MeshBuilder.CreateBox("nose", { width: 0.5, height: 0.25, depth: 0.7 }, scene);
      nose.parent = player;
      nose.position.set(0, 0.15, 1.3);
      const nmat = new BABYLON.StandardMaterial("nmat", scene);
      nmat.emissiveColor = new BABYLON.Color3(1, 0.55, 0.15);
      nose.material = nmat;
      camera.lockedTarget = player;

      const keys = Object.create(null);
      window.addEventListener("keydown", (e) => { keys[e.code] = true; });
      window.addEventListener("keyup", (e) => { keys[e.code] = false; });

      let state = "menu";
      let score = 0;
      let orbsLeft = 0;
      let timeLeft = 60;
      let vel = new BABYLON.Vector3(0, 0, 0);
      let yaw = 0;
      let orbs = [];
      let sentries = [];

      function rand(min, max) { return min + Math.random() * (max - min); }

      function clearMeshes(list) {
        list.forEach((m) => m.dispose());
        list.length = 0;
      }

      function spawnOrbs(count) {
        clearMeshes(orbs);
        for (let i = 0; i < count; i++) {
          const orb = BABYLON.MeshBuilder.CreateSphere("orb" + i, { diameter: 1.1 }, scene);
          orb.position.set(rand(-32, 32), 1.1, rand(-32, 32));
          const mat = new BABYLON.StandardMaterial("omat" + i, scene);
          mat.emissiveColor = new BABYLON.Color3(0.2 + Math.random() * 0.4, 0.8, 0.4 + Math.random() * 0.5);
          mat.diffuseColor = mat.emissiveColor;
          orb.material = mat;
          orbs.push(orb);
        }
        orbsLeft = orbs.length;
        orbsEl.textContent = String(orbsLeft);
      }

      function spawnSentries(count) {
        clearMeshes(sentries);
        for (let i = 0; i < count; i++) {
          const s = BABYLON.MeshBuilder.CreateSphere("s" + i, { diameter: 1.6 }, scene);
          s.position.set(rand(-30, 30), 1.0, rand(-30, 30));
          const mat = new BABYLON.StandardMaterial("smat" + i, scene);
          mat.emissiveColor = new BABYLON.Color3(0.95, 0.15, 0.25);
          s.material = mat;
          s.metadata = { angle: Math.random() * Math.PI * 2, speed: 4 + Math.random() * 4 };
          sentries.push(s);
        }
      }

      function resetGame() {
        score = 0;
        timeLeft = 60;
        vel.set(0, 0, 0);
        yaw = 0;
        player.position.set(0, 0.6, 0);
        player.rotation.set(0, 0, 0);
        spawnOrbs(10);
        spawnSentries(4);
        scoreEl.textContent = "0";
        timeEl.textContent = "60";
      }

      function endGame(won) {
        state = "over";
        overlay.classList.remove("hidden");
        titleEl.textContent = won ? "CLEAN SWEEP" : "SIGNAL LOST";
        blurbEl.textContent = won
          ? "You vacuumed the sector. Score " + score + "."
          : "The sentries tagged you or time ran out. Score " + score + ".";
        startBtn.textContent = "PLAY AGAIN";
      }

      function startGame() {
        resetGame();
        state = "play";
        overlay.classList.add("hidden");
        canvas.focus();
      }

      startBtn.addEventListener("click", startGame);

      let acc = 0;
      scene.onBeforeRenderObservable.add(() => {
        const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
        if (state !== "play") return;

        acc += dt;
        if (acc >= 1) {
          acc -= 1;
          timeLeft -= 1;
          timeEl.textContent = String(Math.max(0, timeLeft));
          if (timeLeft <= 0) endGame(false);
        }

        const forward = (keys.KeyW || keys.ArrowUp) ? 1 : (keys.KeyS || keys.ArrowDown) ? -1 : 0;
        const turn = (keys.KeyA || keys.ArrowLeft) ? 1 : (keys.KeyD || keys.ArrowRight) ? -1 : 0;
        const boost = (keys.ShiftLeft || keys.ShiftRight) ? 1.8 : 1;
        yaw += turn * 2.4 * dt;
        player.rotation.y = yaw;
        const dirv = new BABYLON.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
        vel = vel.scale(0.90).add(dirv.scale(forward * 28 * boost * dt));
        player.position.addInPlace(vel.scale(dt));
        player.position.x = Math.max(-38, Math.min(38, player.position.x));
        player.position.z = Math.max(-38, Math.min(38, player.position.z));
        player.position.y = 0.6 + Math.sin(performance.now() * 0.006) * 0.08;

        for (let i = orbs.length - 1; i >= 0; i--) {
          const o = orbs[i];
          o.position.y = 1.1 + Math.sin(performance.now() * 0.004 + i) * 0.25;
          o.rotation.y += dt * 2;
          if (BABYLON.Vector3.Distance(player.position, o.position) < 1.7) {
            o.dispose();
            orbs.splice(i, 1);
            score += 100;
            orbsLeft = orbs.length;
            scoreEl.textContent = String(score);
            orbsEl.textContent = String(orbsLeft);
            if (orbsLeft === 0) endGame(true);
          }
        }

        sentries.forEach((s, i) => {
          s.metadata.angle += dt * 0.6;
          s.position.x += Math.cos(s.metadata.angle) * s.metadata.speed * dt;
          s.position.z += Math.sin(s.metadata.angle + i) * s.metadata.speed * dt;
          s.position.x = Math.max(-36, Math.min(36, s.position.x));
          s.position.z = Math.max(-36, Math.min(36, s.position.z));
          if (BABYLON.Vector3.Distance(player.position, s.position) < 1.8) endGame(false);
        });
      });

      engine.runRenderLoop(() => scene.render());
      window.addEventListener("resize", () => engine.resize());
      window.__GAME_OK__ = true;
    })();
  </script>
</body>
</html>
